name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Decode Keystore
      env:
        # Check both vars and secrets, case-insensitive logic handled by falling back
        DEBUG_KEY_BASE64: ${{ vars.Debug_Key || secrets.Debug_Key || vars.DEBUG_KEY || secrets.DEBUG_KEY }}
      run: |
        if [ -n "$DEBUG_KEY_BASE64" ]; then
          echo "$DEBUG_KEY_BASE64" | base64 --decode > debug.keystore
          echo "debug.keystore successfully decoded."
        else
          echo "Warning: Debug_Key not found in secrets or variables."
        fi

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
